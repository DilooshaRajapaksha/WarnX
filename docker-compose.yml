name: warnx

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: warnx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warnx_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warnx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./backend/gateway
    restart: unless-stopped
    environment:
      WEATHER_URL: http://weather-service:8000
      ACTION_URL: http://action-service:8000
      COORDINATION_URL: http://coordination-service:8000
      LEARNING_URL: http://learning-service:8000
      SERVICE_TIMEOUT: "5"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    volumes:
      - ./backend/gateway/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  weather-service:
    build: ./backend/services/weather-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://warnx:${POSTGRES_PASSWORD:-warnx_dev_password}@postgres:5432/weather_db
      REDIS_URL: redis://redis:6379/0
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - ./backend/services/weather-service/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  action-service:
    build: ./backend/services/action-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://warnx:${POSTGRES_PASSWORD:-warnx_dev_password}@postgres:5432/action_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/services/action-service/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  coordination-service:
    build: ./backend/services/coordination-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://warnx:${POSTGRES_PASSWORD:-warnx_dev_password}@postgres:5432/coordination_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/services/coordination-service/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  learning-service:
    build: ./backend/services/learning-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://warnx:${POSTGRES_PASSWORD:-warnx_dev_password}@postgres:5432/learning_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/services/learning-service/app:/code/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-web:
    profiles: ["web"]
    build:
      context: ./app
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"

  frontend-dev:
    profiles: ["mobile"]
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://${HOST_IP:-localhost}:8000
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-localhost}
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./app:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
